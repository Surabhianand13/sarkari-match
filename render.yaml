# Render Blueprint on the FREE plan: one web service. The database is a separate, standalone Supabase project for Sarkari Match
# (free plan, no 30-day expiry). Cloudflare sits in front for DNS, HTTPS, caching and bot protection, and a Cloudflare Worker keeps
# the free web service awake and touches the database once a day (see infra/cloudflare and docs/launch-checklist.md).
#
# Free limit to know: the web service sleeps after 15 minutes without traffic and takes about a minute to wake (Cloudflare's cache and
# keep-alive worker soften this).
#
# Optional settings are added later in the service's Environment tab: NEXT_PUBLIC_SUPPORT_EMAIL (your real support inbox),
# NEXT_PUBLIC_LEGAL_NAME, NEXT_PUBLIC_SUPPORT_PHONE, NEXT_PUBLIC_BUSINESS_ADDRESS, NEXT_PUBLIC_GRIEVANCE_OFFICER,
# NEXT_PUBLIC_WHATSAPP_NUMBER, RESEND_API_KEY, EMAIL_FROM, TEST_CHECKOUT_URL, ANTHROPIC_API_KEY.
services:
  - type: web
    name: sarkarimatch-web
    runtime: node
    plan: free
    region: singapore
    # Migrations run before the build so the pages built here can read the database. Free plans have no pre-deploy command or shell.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm db:migrate && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NEXT_PUBLIC_SITE_URL
        value: https://sarkarimatch.com
      # The Supabase "Session pooler" connection string (port 5432) of the Sarkari Match project, with your database password filled in.
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: ACCESS_GRANT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SUPPORT_EMAIL
        value: support@sarkarimatch.com
      # Hides the 1 lakh+ / 5,000+ numbers on the site. Set to false (and redeploy) once those figures are true.
      - key: NEXT_PUBLIC_HIDE_PLATFORM_STATS
        value: "true"
