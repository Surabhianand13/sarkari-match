# Render Blueprint: web service + Postgres. Cloudflare sits in front for DNS, caching and protection.
services:
  - type: web
    name: sarkarimatch-web
    runtime: node
    plan: starter
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    preDeployCommand: pnpm db:migrate
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NEXT_PUBLIC_SITE_URL
        value: https://sarkarimatch.com
      - key: DATABASE_URL
        fromDatabase:
          name: sarkarimatch-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ACCESS_GRANT_SECRET
        generateValue: true
      - key: TEST_CHECKOUT_URL
        sync: false
      # Hides the 1 lakh+ / 5,000+ numbers on the site. Set to false (and redeploy) once those figures are true.
      - key: NEXT_PUBLIC_HIDE_PLATFORM_STATS
        value: "true"
      - key: NEXT_PUBLIC_LEGAL_NAME
        sync: false
      - key: NEXT_PUBLIC_SUPPORT_EMAIL
        value: support@sarkarimatch.com
      - key: NEXT_PUBLIC_SUPPORT_PHONE
        sync: false
      - key: NEXT_PUBLIC_BUSINESS_ADDRESS
        sync: false
      - key: NEXT_PUBLIC_GRIEVANCE_OFFICER
        sync: false
      - key: NEXT_PUBLIC_WHATSAPP_NUMBER
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

databases:
  - name: sarkarimatch-db
    plan: basic-256mb
    region: singapore
