<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SarkariMatch Collector</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup">
    <h1>SarkariMatch Collector</h1>
    <p class="hint">Open a notification on another site, then analyse it. It goes to your review queue; nothing is published.</p>
    <button id="check" class="primary">Check for new and updated notifications</button>
    <button id="analyse" class="secondary">Analyse this page</button>
    <button id="list" class="secondary">Read every notification on this listing page</button>
    <div id="result" role="status" aria-live="polite"></div>
    <p class="footer"><a href="#" id="backfill">Bring in the last 6 months</a> · <a href="#" id="settings">Settings</a></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
